# TimeMachine nginx configuration
# Install to: /etc/nginx/sites-available/timemachine
# Symlink to: /etc/nginx/sites-enabled/timemachine

upstream timemachine_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name timemachine.local _;

    # Increase client body size for file uploads
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/timemachine-access.log;
    error_log /var/log/nginx/timemachine-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend static files
    location / {
        root /opt/timemachine/static;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://timemachine_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://timemachine_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Media files (recordings, stills, timelapses)
    location /media/ {
        alias /var/lib/timemachine/media/;
        expires 24h;
        add_header Cache-Control "public";

        # Security: Prevent directory listing
        autoindex off;

        # Only serve specific file types
        location ~ \.(jpg|jpeg|png|mp4|webm)$ {
            add_header Content-Disposition "inline";
        }
    }

    # Health check endpoint (no auth required)
    location = /api/v1/health {
        proxy_pass http://timemachine_backend;
        access_log off;
    }
}

